<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMO — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sage: #5a8a72;
    --sage-light: #8ab49a;
    --sage-pale: #e8f2ec;
    --sage-dark: #3a6652;
    --blush: #e8a598;
    --blush-pale: #fdf0ee;
    --lavender: #9b8ec4;
    --lavender-pale: #f0edf8;
    --ink: #1c2b24;
    --ink-mid: #4a6358;
    --ink-soft: #7a9488;
    --cream: #faf8f4;
    --white: #ffffff;
    --border: rgba(90,138,114,0.15);
    --shadow: 0 4px 24px rgba(28,43,36,0.08);
    --radius: 20px;
    --radius-sm: 12px;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'Sora', system-ui, sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .auth-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 900px;
    width: 100%;
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 560px;
  }

  /* ── LEFT PANEL ── */
  .auth-left {
    background: linear-gradient(135deg, var(--sage-pale) 0%, var(--lavender-pale) 100%);
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .auth-left::after {
    content: '';
    position: absolute;
    right: -60px; bottom: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: rgba(155,142,196,0.15);
  }

  .logo-mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--sage), var(--lavender));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }

  .logo-icon svg { width: 20px; height: 20px; }

  .logo-mark h1 {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    font-weight: 400;
  }

  .auth-left-body { z-index: 1; }

  .auth-left-body h2 {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 400;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.3;
  }

  .auth-left-body p {
    font-size: 14px;
    color: var(--ink-mid);
    line-height: 1.7;
  }

  .auth-features {
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1;
  }

  .auth-feature {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-mid);
  }

  .auth-feature-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--sage);
    flex-shrink: 0;
  }

  /* ── RIGHT PANEL ── */
  .auth-right {
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .auth-tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 4px;
    margin-bottom: 32px;
  }

  .auth-tab {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    border-radius: 50px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.2s;
  }

  .auth-tab.active {
    background: var(--sage);
    color: white;
  }

  .auth-form { display: none; flex-direction: column; gap: 16px; }
  .auth-form.active { display: flex; }

  .form-group { display: flex; flex-direction: column; gap: 6px; }

  .form-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .form-input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--cream);
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus { border-color: var(--sage); background: var(--white); }
  .form-input::placeholder { color: var(--ink-soft); }

  .btn-primary {
    padding: 12px;
    background: var(--sage);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .btn-primary:hover { background: var(--sage-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(90,138,114,0.3); }

  .auth-error {
    font-size: 12px;
    color: var(--blush);
    min-height: 18px;
    text-align: center;
  }

  .auth-footer-note {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="auth-wrapper">

  <!-- LEFT -->
  <div class="auth-left">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2C5.6 2 2 5.6 2 10s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z" fill="white" opacity="0.3"/>
          <path d="M10 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 14c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>EMO</h1>
    </div>

    <div class="auth-left-body">
      <h2>Your mental wellness companion</h2>
      <p>A private, calm space to check in with yourself — every day.</p>
    </div>

    <div class="auth-features">
      <div class="auth-feature"><div class="auth-feature-dot"></div>Daily mood tracking & insights</div>
      <div class="auth-feature"><div class="auth-feature-dot"></div>Private journaling with AI prompts</div>
      <div class="auth-feature"><div class="auth-feature-dot"></div>Guided breathing & stress programs</div>
      <div class="auth-feature"><div class="auth-feature-dot"></div>Serenity — your compassionate companion</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="auth-right">

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button type="button" class="auth-tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN FORM -->
    <div class="auth-form active" id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
      </div>
      <div class="auth-error" id="loginError"></div>
      <button type="button" class="btn-primary" onclick="handleLogin()">Sign In</button>
    </div>

    <!-- REGISTER FORM -->
    <div class="auth-form" id="registerForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="registerPassword" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" id="registerConfirm" placeholder="••••••••">
      </div>
      <div class="auth-error" id="registerError"></div>
      <button type="button" class="btn-primary" onclick="handleRegister()">Create Account</button>
    </div>

    <div class="auth-footer-note">
      Your data is private and never shared.
    </div>

  </div>
</div>
<script src="/static/emo.login.js"></script>

</body>
</html>
